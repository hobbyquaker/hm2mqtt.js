name: Addon package

# Builds the installable CCU addon package (addon/build.sh), which includes assembling the
# bundled Node.js runtime (addon/build-runtime.sh). Manual for all architectures, automatic on
# changes to the addon itself - none of this can be built on macOS, so CI is the only way to
# exercise it.

on:
  workflow_dispatch:
    inputs:
      node-major:
        description: 'Node major version to bundle (default 24)'
        required: false
        default: '24'
  push:
    branches: [master, main]
    paths: ['addon/**', 'scripts/addon-api.js', '.github/workflows/addon-runtime.yml']
  pull_request:
    paths: ['addon/**', 'scripts/addon-api.js', '.github/workflows/addon-runtime.yml']

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # armv7l is the interesting one (Alpine musl repackage + patchelf); the others are stock
        # tarballs and only built on demand
        arch: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["armv7l", "aarch64", "x86_64"]') || fromJSON('["armv7l"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # patchelf rewrites the armv7l runtime's ELF headers, tcl runs the CGI tests
      - run: sudo apt-get update && sudo apt-get install -y patchelf tcl
      - name: Test the CGIs
        run: addon/test/cgi-test.sh
      - name: Build addon package
        run: addon/build.sh ${{ matrix.arch }} --beta
        env:
          NODE_MAJOR: ${{ inputs.node-major || '24' }}
      - name: Test the built package as installed
        run: addon/test/package-test.sh dist/*.tar.gz
      - name: Inspect the result
        run: |
          cat addon/work/${{ matrix.arch }}/pkg/hm2mqtt/versions
          file addon/work/${{ matrix.arch }}/pkg/hm2mqtt/bin/node
          tar tzf dist/*.tar.gz | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: hm2mqtt-addon-${{ matrix.arch }}
          path: dist/
          retention-days: 14
