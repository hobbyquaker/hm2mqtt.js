# OpenCCU ships monit; the CCU3 firmware does not. Passive mode: monit restarts hm2mqtt when it
# dies, but never starts it on boot - run-parts does that.
CHECK PROCESS hm2mqtt PIDFILE /var/run/hm2mqtt.pid
    GROUP hm2mqtt
    MODE PASSIVE
    ONREBOOT NOSTART

    start = "/usr/local/etc/config/rc.d/hm2mqtt start"
    stop = "/usr/local/etc/config/rc.d/hm2mqtt stop"
    restart = "/usr/local/etc/config/rc.d/hm2mqtt restart"

    if memory usage > 200 MB then alert
    if cpu > 80% for 3 cycles then alert
